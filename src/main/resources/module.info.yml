manifest-version: 2
target-platform: PAPER
supported-minecraft: ["1.21.11", "26.3"]
java-version: 21
configuration-schema: 1
id: scoreboard
name: Scoreboard
version: 1.0.0
description: Custom scoreboard module

main: org.wannes.ScoreboardModule
api-version: 1
dependencies:
  - placeholderapi
required-services:
  org.wannes.plugModCore.api.PlaceholderService: placeholderapi

website:
  enabled: true
  entry: web/index.html
  title: Scoreboard

data:
  defaults:
    files:
      - scoreboard.yml
      - web/index.html
      - web/scoreboard.css
      - web/scoreboard.js
